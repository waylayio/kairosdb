name: Tests

on:
  push:
    branches: [ "develop", "main", "master" ]
  pull_request:
    branches: [ "develop", "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up build environment
      run: |
        export CLASSPATH=tools/tablesaw-1.2.8.jar
        echo "CLASSPATH=$CLASSPATH" >> $GITHUB_ENV

    - name: Retrieve dependencies
      run: |
        export CLASSPATH=tools/tablesaw-1.2.8.jar
        java make ivy-retrieve

    - name: Compile code
      run: |
        export CLASSPATH=tools/tablesaw-1.2.8.jar
        java make compile

    - name: Compile tests
      run: |
        export CLASSPATH=tools/tablesaw-1.2.8.jar
        java make compile-test

    - name: Run tests
      run: |
        export CLASSPATH=tools/tablesaw-1.2.8.jar
        java make test

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          build/test-results/
          build/reports/
        retention-days: 7

