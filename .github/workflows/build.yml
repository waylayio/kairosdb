name: Build
on:
  workflow_dispatch:

  push:
    branches:
      - 1.3.0-waylay
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      cassandra:
        image: cassandra:3.11
        env:
          CASSANDRA_START_RPC: true
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh --debug"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25-ea'
        distribution: 'temurin'
    - name: compile and test
      env:
        CASSANDRA_HOST: localhost
      run: mvn clean test

